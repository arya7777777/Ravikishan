html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#431018 0,transparent 60%),#0a0a0f;background-attachment:fixed;color:var(--fg);font:16px/1.45 "Special Elite","Courier New",monospace;overflow-x:hidden}
body::before{content:"☠️ 🕯️ 🪦 🩸 🦇 ⚰️ 💀 🕷️ ☠️ 🕯️ 🪦 🩸 🦇 ⚰️ 💀 🕷️ ☠️ 🕯️ 🪦 🩸 🦇 ⚰️ 💀 🕷️ ☠️ 🕯️ 🪦 🩸 🦇 ⚰️ 💀 🕷️ ☠️ 🕯️ 🪦 🩸 🦇 ⚰️ 💀 🕷️ ☠️ 🕯️ 🪦 🩸 🦇 ⚰️ 💀 🕷️";position:fixed;inset:-40px -40px -220px -40px;font-size:50px;line-height:2.1;word-spacing:30px;opacity:.06;pointer-events:none;animation:dr 40s linear infinite;overflow:hidden}
@keyframes dr{to{transform:translateY(-130px)}}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0000000d 2px 3px)}
#app{max-width:560px;margin:0 auto;padding:14px;position:relative;z-index:1}
h1,.big,button,.sub{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-weight:400}
.hd{display:flex;align-items:center;gap:14px;margin:6px 0}
.av{width:78px;height:78px;border-radius:50%;flex:none;background:var(--face) center/cover;border:3px solid var(--red);box-shadow:0 0 0 3px #000,0 0 28px #e11d2e99;animation:pl 3s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 0 3px #000,0 0 44px #e11d2e}}
.logo{margin:0;font-size:clamp(40px,12vw,60px);line-height:.95;letter-spacing:2px;color:#fff;text-shadow:3px 3px 0 var(--red),-1px -1px 0 #000}
.sub{color:var(--mut);letter-spacing:3px;font-size:17px}
.tick{overflow:hidden;white-space:nowrap;border-block:1px solid #2a2a38;margin:10px 0;color:var(--red);font:18px "Bebas Neue",Impact,sans-serif;letter-spacing:2px}
.tick span{display:inline-block;padding:3px 0;animation:mq 22s linear infinite}
@keyframes mq{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.card{background:linear-gradient(#181823,#101018);border:1px solid #2a2a38;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 10px 40px #000a,inset 0 1px 0 #ffffff12}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
button{border:0;border-radius:10px;padding:10px 16px;background:var(--red);color:#fff;font-size:20px;letter-spacing:1.5px;cursor:pointer;box-shadow:0 6px 20px #e11d2e44;transition:transform .1s,box-shadow .2s}
button:hover{box-shadow:0 0 24px #e11d2e99}
button:active{transform:scale(.96)}
button.ghost{background:transparent;border:1px solid #3b3b52;color:var(--mut);box-shadow:none}
button.alt{background:#2d2d44}
button.dot{width:34px;height:34px;padding:0;border:2px solid #555;border-radius:50%;box-shadow:none}
input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #3b3b52;background:#0b0b11;color:var(--fg);flex:1;min-width:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;overflow:hidden;min-height:120px;text-align:left;background:linear-gradient(120deg,#0a0a0f 30%,#0a0a0f99),var(--bw) right 20%/cover;border:1px solid #2f2f40;color:#fff;font-size:24px;letter-spacing:1px;line-height:1.1;padding:14px}
.tile b{display:block;font-size:32px;font-weight:400}
.tile small{display:block;margin-top:6px;line-height:1.3;font:12px/1.3 "Special Elite",monospace;color:var(--mut);letter-spacing:0}
.tile:hover{border-color:var(--red);transform:translateY(-2px)}
.tile:nth-child(5){grid-column:1/-1}
.chip{display:inline-block;border:1px solid var(--red);color:#ffb3ba;border-radius:99px;padding:1px 10px;margin:2px;font-size:13px}
.big{font-size:28px;margin:6px 0 10px;text-align:center;letter-spacing:1.5px;animation:po .35s ease-out}
@keyframes po{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.jf{display:inline-block;width:44px;height:44px;border-radius:50%;background:var(--face) center/cover;border:2px solid var(--red);vertical-align:middle;margin-right:8px}
.quote{font-size:19px;text-align:center;padding:14px;border-left:4px solid var(--red);background:#0b0b11;border-radius:8px;margin:8px 0}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:10px auto}
.ttt button{aspect-ratio:1;font-size:44px;background:#0b0b11;color:#fff;border:1px solid #3b3b52;box-shadow:none}
.vote{flex:1;padding:18px 10px;font-size:22px}
.whw{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:14px auto}
#wh{width:100%;height:100%;border-radius:50%;transition:transform 4.2s cubic-bezier(.12,.7,.1,1);box-shadow:0 0 40px #e11d2e66}
.hub{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:var(--face) center/cover;border:3px solid #fff;box-shadow:0 0 0 3px var(--red)}
.ptr{position:absolute;top:-10px;left:50%;margin-left:-13px;width:0;height:0;border:13px solid transparent;border-top:28px solid #fff;filter:drop-shadow(0 0 6px var(--red));z-index:2}
#log{font-size:14px;max-height:110px;overflow:auto;color:var(--mut)}
small{color:var(--mut)}
#app>small{color:#ffb3ba}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000e;border:1px solid var(--red);color:#fff;border-radius:99px;padding:8px 16px;display:none;z-index:9;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

<script>

let room=null,S={g:'lobby',k:0},me='Player',G=[],lk='',col='#111',sz=4,spinUntil=0,wnames='';
const peers=()=>room?[...room.peers()].filter(p=>p.kind==='viewer').sort((a,b)=>a.peer<b.peer?-1:1):[];
const nm=p=>(p&&p.presence&&p.presence.n)||'Player';

addEventListener('error',e=>msg('Bug: '+e.message));

const cv=document.createElement('canvas');cv.width=600;cv.height=400;
cv.style.cssText='width:100%;background:#fff;border-radius:12px;touch-action:none;border:2px solid var(--red)';

cv.onpointerdown=e=>{if(S.g!=='scr'||myId()!==S.d||S.done)return;pd=pt(e);cv.setPointerCapture(e.pointerId);const s=[pd[0],pd[1],pd[0],pd[1],col,sz];seg(s);buf.push(s)};

cv.onpointerup=cv.onpointercancel=()=>{pd=null};
setInterval(()=>{if(buf.length&&room)room.emit('draw',{s:buf.splice(0,120)}).catch(()=>{})},80);

const wh=document.createElement('canvas');wh.width=wh.height=600;wh.id='wh';wh.style.transform='rotate(0deg)';
function drawW(n){const key=n.join('|');if(key===wnames)return;wnames=key;
  const c=wh.getContext('2d'),N=n.length||1,a=2*Math.PI/N,cs=['#7a0c16','#1f1f2e','#b3121f','#2d2d44','#5a0f1a'];c.clearRect(0,0,600,600);
  for(let i=0;i<N;i++){c.beginPath();c.moveTo(300,300);c.arc(300,300,290,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a);c.closePath();c.fillStyle=cs[i%5];c.fill();c.strokeStyle='#000';c.lineWidth=4;c.stroke();
    c.save();c.translate(300,300);c.rotate(-Math.PI/2+(i+.5)*a);c.fillStyle='#fff';c.font='38px "Bebas Neue",Impact,sans-serif';c.textAlign='right';c.fillText((n[i]||'').slice(0,10),272,13);c.restore()}
  c.beginPath();c.arc(300,300,293,0,7);c.lineWidth=10;c.strokeStyle='#e11d2e';c.stroke()}

function showJoin(){
  $('#app').innerHTML=HD+`<div class="card"><p>Pick a name. Pick a room code. The whole GC types the <b>same code</b>. Resistance is futile. ☠️</p>

  $('#c').value=Math.random().toString(36).slice(2,6)}

    room.onPeers(c=>{
      if(c.joined.length&&S.g!=='lobby'){const old=peers().filter(p=>!c.joined.some(j=>j.peer===p.peer));if(old[0]&&old[0].peer===myId())send(S)}
      if(S.g!=='scr')render()});
    render(true);
  }catch(e){$('#err').textContent='Couldn’t connect. Refresh and try again.'}
}
function fillLog(){const l=$('#log');if(l)l.innerHTML=G.map(esc).join('<br>')}
function start(g){
  const ps=peers(),k=(S.k||0)+1;
  if(!ps.length)return msg('Not connected yet. Wait a second and retry, or check the Firebase rules.');
  if(g==='scr'&&ps.length<2)return msg('Bro… you need a friend. 2+ players 💀');

}
const menu=()=>send({g:'lobby',k:S.k+1});
function place(s,i){const b=[...s.b];b[i]=s.t%2?'O':'X';let w='';for(const l of L)if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[0]]===b[l[2]])w=b[l[0]];if(!w&&b.every(x=>x))w='draw';return{...s,b,t:s.t+1,w}}
const mv=i=>{const s=S;if(s.g!=='ttt'||s.w||s.b[i]||myId()!==s.p[s.t%2])return;send(place(s,i))};

function spinW(){const ps=peers();if(ps.length<2)return msg('Bro… you need a friend. 2+ players 💀');
  const n=ps.length,i=Math.floor(Math.random()*n),cen=(i+.5)*360/n,prev=S.ang||0,d=(((360-cen-prev%360)%360)+360)%360,jit=(Math.random()-.5)*(360/n)*.7;
  send({g:'tod',k:S.k+1,ph:'spin',pl:ps.map(nm),wp:ps[i].peer,wn:nm(ps[i]),ang:prev+1800+d+jit})}
const pickC=c=>send({...S,k:S.k+1,ph:'ask',c});
function sub(){const i=$('#pi'),t=i.value.trim().slice(0,120);if(!t)return;room.presence({sub:t});i.value='';msg('Sent 😈')}
function reveal(){const c=peers().filter(p=>p.peer!==S.wp&&p.presence&&p.presence.sub);if(!c.length)return msg('Nobody wrote anything yet 💀');const p=pick(c);send({...S,k:S.k+1,ph:'show',t:p.presence.sub,by:nm(p)})}

function guess(){const i=$('#gi'),t=i.value.trim();i.value='';if(!t||S.done)return;

  else room.emit('guess',{n:me,t:t.slice(0,60)}).catch(()=>{})}
const chips=a=>a.map(p=>`<span class="chip">${esc(nm(p))}</span>`).join('');

    h=`<div class="card"><div class="big">Choose your poison ☠️</div><div class="grid">
